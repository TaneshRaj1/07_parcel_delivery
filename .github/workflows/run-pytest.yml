name: Run Pytest    
on: push 
paths:                                  # NEW: only run when these change
      - "**.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/*.yml"   
jobs:    
  run-pytest:    
    runs-on: ubuntu-latest 
    timeout-minutes: 5   
    steps:    
      - name: Checkout repository 
        uses: actions/checkout@v7.0.1  

      - name: Set up Python    
        uses: actions/setup-python@v7 
        with:    
          python-version: '3.12' 
          cache: 'pip'

      - name: Install pytest  
        run: |    
          python -m pip install --upgrade pip    
          pip install pytest    

      - name: Run Pytest    
        run: |    
           python -m pytest -v -ra --tb=short
